// Vendored from usb_serial 0.5.2 (BSD-3-Clause, see ../LICENSE).
// Changed for current Android Gradle Plugin: no buildscript block, no
// jcenter(), compileSdk 35 and Java 17. Sources are unchanged.
group 'dev.bessems.usbserial'
version '1.0'

rootProject.allprojects {
    repositories {
        google()
        mavenCentral()
        // felHR85 UsbSerial is only published on JitPack.
        maven { url "https://jitpack.io" }
    }
}

apply plugin: 'com.android.library'

android {
    namespace 'dev.bessems.usbserial'
    compileSdk 35

    defaultConfig {
        minSdk 21
    }
    lint {
        disable 'InvalidPackage'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.github.felHR85:UsbSerial:6.1.0'
}
