# macOS app icon, used by the NOTORYX macOS Build workflow:
#   dart run flutter_launcher_icons -f tool/macos_launcher_icons.yaml
flutter_launcher_icons:
  android: false
  ios: false
  macos:
    generate: true
    # Rounded macOS tile with its own transparent margin.
    image_path: branding/notoryx-icon-macos.png
