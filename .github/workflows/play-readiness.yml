name: NOTORYX Google Play Readiness
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'pubspec.yaml'
      - 'scripts/prepare_android.py'
      - '.github/workflows/play-readiness.yml'
permissions:
  contents: read
jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Install Android NDK (retries corrupted downloads)
        uses: ./.github/actions/install-android-ndk
      - run: |
          flutter create --no-pub --platforms=android --org com.bastionmesh --project-name bastion .
          # flutter create replaces pubspec.lock with a template; restore the committed one.
          git checkout -- pubspec.lock
          rm -f test/widget_test.dart
          python3 scripts/prepare_android.py
          flutter pub get --enforce-lockfile
          dart run flutter_launcher_icons
          # Fails if the Android launcher icon was not generated (e.g. a stray
          # flutter_launcher_icons-*.yaml makes the tool skip the main config).
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          flutter analyze
          flutter test
      - name: Build Android App Bundle (not Play signed)
        run: flutter build appbundle --release
      - name: Verify bundle
        run: |
          test -s build/app/outputs/bundle/release/app-release.aab
          # Google Play restricts SMS permissions; this build must never carry them.
          if grep -q 'permission.SEND_SMS' android/app/src/main/AndroidManifest.xml; then exit 1; fi
      - uses: actions/upload-artifact@v7
        with:
          name: NOTORYX-Play-Readiness-AAB
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
          if-no-files-found: error
