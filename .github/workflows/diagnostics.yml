name: NOTORYX Diagnostic Report
on:
  workflow_dispatch:
  schedule:
    - cron: '23 10 * * 2'
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Prepare dependencies
        run: flutter pub get --enforce-lockfile
      - name: Capture environment
        run: |
          mkdir -p diagnostics
          flutter --version > diagnostics/flutter-version.txt
          flutter doctor -v > diagnostics/flutter-doctor.txt 2>&1 || true
          git rev-parse HEAD > diagnostics/commit.txt
      - name: Capture analysis results
        run: flutter analyze > diagnostics/analyze.log 2>&1
      - name: Capture test results
        run: bash scripts/warm_native_assets.sh && flutter test --reporter expanded > diagnostics/tests.log 2>&1
      - name: Upload diagnostics even on failure
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NOTORYX-Diagnostics-${{ github.run_number }}
          path: diagnostics/
          retention-days: 14
          if-no-files-found: warn
