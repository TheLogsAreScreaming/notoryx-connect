name: NOTORYX Release Candidate Package
on:
  workflow_dispatch:
    inputs:
      release_label:
        description: 'Human-readable release candidate label'
        required: true
        default: 'NOTORYX Connect RC'
        type: string
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 25
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install Android NDK (retries corrupted downloads)
        uses: ./.github/actions/install-android-ndk
      - name: Prepare Android build
        run: |
          flutter create --no-pub --platforms=android --org com.bastionmesh --project-name bastion .
          # flutter create replaces pubspec.lock with a template; restore the committed one.
          git checkout -- pubspec.lock
          rm -f test/widget_test.dart
          python3 scripts/prepare_android.py
          flutter pub get --enforce-lockfile
          dart run flutter_launcher_icons
          # Fails if the Android launcher icon was not generated (e.g. a stray
          # flutter_launcher_icons-*.yaml makes the tool skip the main config).
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
      - name: Analyze and test
        run: |
          flutter analyze
          bash scripts/warm_native_assets.sh
          flutter test
      - name: Build release-mode test APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Prepare package
        env:
          RELEASE_LABEL: ${{ inputs.release_label }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p release-package
          cp build/app/outputs/flutter-apk/app-release.apk release-package/NOTORYX-Connect-RC-arm64.apk
          sha256sum release-package/NOTORYX-Connect-RC-arm64.apk > release-package/SHA256SUMS.txt
          printf 'Release candidate: %s\nCommit: %s\nRun: %s\n' "$RELEASE_LABEL" "$COMMIT_SHA" "$GITHUB_RUN_ID" > release-package/BUILD-INFO.txt
          git log -n 20 --pretty=format:'- %h %s' > release-package/CHANGES.txt
          printf '\n' >> release-package/CHANGES.txt
      - name: Upload candidate bundle
        uses: actions/upload-artifact@v7
        with:
          name: NOTORYX-Release-Candidate-${{ github.run_number }}
          path: release-package/
          retention-days: 30
          if-no-files-found: error
