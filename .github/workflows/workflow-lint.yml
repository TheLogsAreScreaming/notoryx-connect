name: NOTORYX Workflow Validation
on:
  push:
    paths:
      - '.github/workflows/**'
      - 'scripts/verify_release_package.py'
      - 'test/release_package_test.py'
      - 'docs/ANDROID-RELEASE-POLICY.json'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'scripts/verify_release_package.py'
      - 'test/release_package_test.py'
      - 'docs/ANDROID-RELEASE-POLICY.json'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Install actionlint
        env:
          ACTIONLINT_VERSION: '1.7.7'
        run: |
          curl --retry 5 --retry-delay 20 --retry-all-errors -fsSLo actionlint.tar.gz "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          tar xzf actionlint.tar.gz actionlint
          sudo install actionlint /usr/local/bin/actionlint
      - name: Validate GitHub Actions YAML
        run: actionlint -color
      - name: Verify release policy failure handling
        run: python3 test/release_package_test.py
