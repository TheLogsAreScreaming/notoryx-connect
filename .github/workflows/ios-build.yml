name: NOTORYX iOS Build

# Proves NOTORYX Connect compiles for iOS. The result is NOT signed and can't
# be installed on a phone: that needs an Apple Developer account, a Team ID
# and signing secrets.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/prepare_ios.py'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

concurrency:
  group: notoryx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Generate and prepare the iOS project
        run: |
          flutter create --no-pub --platforms=ios --org com.bastionmesh --project-name bastion .
          # flutter create replaces pubspec.lock with a template; restore the committed one.
          git checkout -- pubspec.lock
          rm -f test/widget_test.dart
          python3 scripts/prepare_ios.py
          flutter pub get --enforce-lockfile
      - name: Build without signing
        run: flutter build ios --release --no-codesign
      - name: Check the app bundle
        run: |
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.bastionmesh.connect
