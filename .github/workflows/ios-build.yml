name: NOTORYX iOS Build

# Proves NOTORYX Connect compiles for iOS. The result is NOT signed. It is
# saved as an unsigned .ipa that Sideloadly or AltStore can sign with a free
# Apple ID for your own phone. App Store builds still need a developer account.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'scripts/prepare_ios.py'
      - 'tool/ios_launcher_icons.yaml'
      - 'branding/notoryx-icon.png'
      - 'lib/services/bastion_message_alerts.dart'
      - '.github/workflows/ios-build.yml'

permissions:
  contents: read

concurrency:
  group: notoryx-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Generate and prepare the iOS project
        run: |
          flutter create --no-pub --platforms=ios --org com.bastionmesh --project-name bastion .
          # flutter create replaces pubspec.lock with a template; restore the committed one.
          git checkout -- pubspec.lock
          rm -f test/widget_test.dart
          flutter pub get --enforce-lockfile
          # The Podfile only exists once Flutter has configured the iOS build.
          flutter build ios --config-only --no-codesign
          python3 scripts/prepare_ios.py
          # Replace Flutter's blank placeholder with the NOTORYX icon.
          dart run flutter_launcher_icons -f tool/ios_launcher_icons.yaml
      - name: Build without signing
        run: flutter build ios --release --no-codesign
      - name: Package unsigned .ipa for sideloading
        # Unsigned: Sideloadly or AltStore signs it with your own Apple ID when installing.
        run: |
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry ../NOTORYX-Connect-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: NOTORYX-Connect-ios-unsigned-ipa
          path: build/NOTORYX-Connect-unsigned.ipa
          retention-days: 30
          if-no-files-found: error
      - name: Check the app bundle
        run: |
          APP=build/ios/iphoneos/Runner.app
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = com.bastionmesh.connect
