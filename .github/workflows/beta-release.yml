name: NOTORYX Beta Release
on:
  workflow_dispatch:
    inputs:
      beta_label:
        description: 'Beta label (e.g. beta-2)'
        required: true
        default: beta-test
        type: string
permissions:
  contents: read
jobs:
  beta:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 25
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Install Android NDK (retries corrupted downloads)
        uses: ./.github/actions/install-android-ndk
      - run: |
          flutter create --no-pub --platforms=android --org com.bastionmesh --project-name bastion .
          # flutter create replaces pubspec.lock with a template; restore the committed one.
          git checkout -- pubspec.lock
          rm -f test/widget_test.dart
          python3 scripts/prepare_android.py
          flutter pub get --enforce-lockfile
          dart run flutter_launcher_icons
          # Fails if the Android launcher icon was not generated (e.g. a stray
          # flutter_launcher_icons-*.yaml makes the tool skip the main config).
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          flutter analyze
          bash scripts/warm_native_assets.sh
          flutter test
          flutter build apk --release --target-platform android-arm64
      - name: Package beta (unsigned for Play distribution)
        env:
          BETA_LABEL: ${{ inputs.beta_label }}
        run: |
          mkdir -p beta
          cp build/app/outputs/flutter-apk/app-release.apk beta/NOTORYX-Connect-Beta-arm64.apk
          (cd beta && sha256sum NOTORYX-Connect-Beta-arm64.apk > SHA256SUMS.txt)
          git log -n 20 --pretty=format:'- %h %s' > beta/CHANGES.md
          printf '\nBeta label: %s\nCommit: %s\n' "$BETA_LABEL" "$GITHUB_SHA" > beta/BUILD-INFO.txt
      - uses: actions/upload-artifact@v7
        with:
          name: NOTORYX-Beta-${{ github.run_number }}
          path: beta/
          retention-days: 30
          if-no-files-found: error
