name: NOTORYX Bluetooth Regression
on:
  push:
    paths:
      - 'lib/services/meshtastic_ble**'
      - 'lib/services/meshtastic_radio_**'
      - 'lib/services/meshtastic_connection_**'
      - 'test/**'
      - '.github/workflows/bluetooth-regression.yml'
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ble:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - name: Run BLE and session regression tests
        run: |
          bash scripts/warm_native_assets.sh
          set -e
          find test -type f \( -iname '*ble*test.dart' -o -iname '*connection*test.dart' -o -iname '*session*test.dart' -o -iname '*transport*test.dart' \) -print > /tmp/bastion-ble-tests
          if test -s /tmp/bastion-ble-tests; then
            xargs -r flutter test --reporter expanded < /tmp/bastion-ble-tests
          else
            echo 'No dedicated BLE regression tests found; running full suite.'
            flutter test --reporter expanded
          fi
