name: NOTORYX On-Demand Test APK
on:
  workflow_dispatch:
    inputs:
      build_label:
        description: 'Build label (letters, numbers, hyphens)'
        required: true
        default: 'field-test'
        type: string
      sms_relay:
        description: 'Include the SMS relay (sideload only, never for Play)'
        required: false
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 25
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true
      - name: Install Android NDK (retries corrupted downloads)
        uses: ./.github/actions/install-android-ndk
      - name: Generate Android platform
        run: |
          flutter create --no-pub --platforms=android --org com.bastionmesh --project-name bastion .
          # flutter create replaces pubspec.lock with a template; restore the committed one.
          git checkout -- pubspec.lock
          rm -f test/widget_test.dart
          python3 scripts/prepare_android.py ${{ inputs.sms_relay && '--sms' || '' }}
      - run: |
          flutter pub get --enforce-lockfile
          dart run flutter_launcher_icons
          # Fails if the Android launcher icon was not generated (e.g. a stray
          # flutter_launcher_icons-*.yaml makes the tool skip the main config).
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
          flutter analyze
          flutter test
      - name: Build APK
        run: flutter build apk --release --target-platform android-arm64 ${{ inputs.sms_relay && '--dart-define=NOTORYX_SMS=true' || '' }}
      - name: Verify APK and checksum
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk > APK-SHA256.txt
      - name: Generate build change summary
        run: |
          git log -n 20 --pretty=format:'- %h %s' > RELEASE-NOTES.txt
          printf '\n' >> RELEASE-NOTES.txt
      - name: Record build details
        env:
          BUILD_LABEL: ${{ inputs.build_label }}
          BUILD_SHA: ${{ github.sha }}
          BUILD_RUN: ${{ github.run_id }}
        run: |
          printf 'Label: %s\nCommit: %s\nRun: %s\n' "$BUILD_LABEL" "$BUILD_SHA" "$BUILD_RUN" > build-details.txt
      - name: Upload test package
        uses: actions/upload-artifact@v7
        with:
          name: NOTORYX-Test-APK-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build-details.txt
            APK-SHA256.txt
            RELEASE-NOTES.txt
          retention-days: 30
          if-no-files-found: error
