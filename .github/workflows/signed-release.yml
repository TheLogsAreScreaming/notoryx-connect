name: NOTORYX Signed Release Candidate
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  signed:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      BASTION_KEYSTORE_BASE64: ${{ secrets.BASTION_KEYSTORE_BASE64 }}
      BASTION_STORE_PASSWORD: ${{ secrets.BASTION_STORE_PASSWORD }}
      BASTION_KEY_PASSWORD: ${{ secrets.BASTION_KEY_PASSWORD }}
      BASTION_KEY_ALIAS: ${{ secrets.BASTION_KEY_ALIAS }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Install Android NDK (retries corrupted downloads)
        uses: ./.github/actions/install-android-ndk
      - name: Prepare Android and signing
        run: |
          python3 scripts/check_release_hygiene.py
          flutter create --no-pub --platforms=android --org com.bastionmesh --project-name bastion .
          # flutter create replaces pubspec.lock with a template; restore the committed one.
          git checkout -- pubspec.lock
          rm -f test/widget_test.dart
          python3 scripts/prepare_android.py
          python3 scripts/configure_android_signing.py
          flutter pub get --enforce-lockfile
          dart run flutter_launcher_icons
          # Fails if the Android launcher icon was not generated (e.g. a stray
          # flutter_launcher_icons-*.yaml makes the tool skip the main config).
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
      - name: Validate
        run: |
          python3 test/release_package_test.py
          flutter analyze
          bash scripts/warm_native_assets.sh
          flutter test
      - name: Build signed candidate and archive symbols
        run: |
          flutter build apk --release --target-platform android-arm64 --obfuscate --split-debug-info=build/release-symbols
          flutter build appbundle --release --obfuscate --split-debug-info=build/bundle-symbols
      - name: Verify signature and package
        run: |
          mkdir -p build/signed-package
          # pubspec version 1.0.0+5 -> NOTORYX-Connect-1.0.0-5
          VERSION=$(sed -n 's/^version: *\([^+]*\)+\(.*\)$/\1-\2/p' pubspec.yaml)
          test -n "$VERSION"
          NAME="NOTORYX-Connect-$VERSION"
          cp build/app/outputs/flutter-apk/app-release.apk "build/signed-package/$NAME.apk"
          cp build/app/outputs/bundle/release/app-release.aab "build/signed-package/$NAME.aab"
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$APKSIGNER" verify --verbose --print-certs "build/signed-package/$NAME.apk" > build/signed-package/SIGNATURE.txt
          python3 scripts/verify_release_package.py "build/signed-package/$NAME.apk" build/signed-package/SIGNATURE.txt
          jarsigner -verify "build/signed-package/$NAME.aab"
          (cd build/signed-package && sha256sum "$NAME.apk" "$NAME.aab" > SHA256SUMS.txt)
          printf 'Version: %s\nCommit: %s\nRun: %s\n' "$VERSION" "$GITHUB_SHA" "$GITHUB_RUN_ID" > build/signed-package/BUILD-INFO.txt
      - uses: actions/upload-artifact@v7
        with:
          name: NOTORYX-Connect-Signed-Candidate-${{ github.run_number }}
          path: |
            build/signed-package/
            build/release-symbols/
            build/bundle-symbols/
          retention-days: 90
          if-no-files-found: error
      - name: Remove signing material
        if: always()
        run: rm -f android/app/bastion-upload.p12
