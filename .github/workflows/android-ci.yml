name: NOTORYX Android CI

on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read

# Cancel superseded builds on the same branch or pull request.
# Preserve builds from other branches and manually dispatched runs.
concurrency:
  group: bastion-android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Install Android NDK (retries corrupted downloads)
        uses: ./.github/actions/install-android-ndk
      - name: Generate Android platform
        run: |
          flutter create --no-pub --platforms=android --org com.bastionmesh --project-name bastion .
          # flutter create replaces pubspec.lock with a template; restore the committed one.
          git checkout -- pubspec.lock
          # Flutter's default template test references MyApp, not BastionApp.
          rm -f test/widget_test.dart
      - name: Verify release signing preparation
        run: python3 test/signing_scripts_test.py
      - name: Prepare permissions
        run: python3 scripts/prepare_android.py
      - name: Install dependencies and icons
        run: |
          flutter pub get --enforce-lockfile
          dart run flutter_launcher_icons
          # Fails if the Android launcher icon was not generated (e.g. a stray
          # flutter_launcher_icons-*.yaml makes the tool skip the main config).
          test -f android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml
      - name: Analyze and test
        run: |
          mkdir -p build/ci-diagnostics
          set -o pipefail
          flutter analyze 2>&1 | tee build/ci-diagnostics/analyze.log
          bash scripts/warm_native_assets.sh
          flutter test --reporter expanded 2>&1 | tee build/ci-diagnostics/tests.log
      - name: Build development APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify and document test APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          mkdir -p build/ci-package
          cp build/app/outputs/flutter-apk/app-release.apk build/ci-package/NOTORYX-Connect-Integration-arm64.apk
          (cd build/ci-package && sha256sum NOTORYX-Connect-Integration-arm64.apk > SHA256SUMS.txt)
          git log -n 20 --pretty=format:'- %h %s' > build/ci-package/CHANGES.txt
          printf '\n' >> build/ci-package/CHANGES.txt
          printf 'Commit: %s\nRun: %s\nBranch: %s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_REF_NAME" > build/ci-package/BUILD-INFO.txt
          echo '### NOTORYX Connect integration APK ready' >> "$GITHUB_STEP_SUMMARY"
          echo 'Download the NOTORYX-Integration-Test-Package artifact from this run.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload integration test package
        uses: actions/upload-artifact@v7
        with:
          name: NOTORYX-Integration-Test-Package
          path: build/ci-package/
          retention-days: 30
          if-no-files-found: error
      - name: Upload CI diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: NOTORYX-CI-Diagnostics
          path: build/ci-diagnostics/
          retention-days: 14
          if-no-files-found: warn
      - name: Upload testing APK
        uses: actions/upload-artifact@v7
        with:
          name: NOTORYX-Development-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
