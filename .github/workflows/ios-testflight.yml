name: NOTORYX iOS TestFlight

# Builds a signed App Store package and uploads it to TestFlight. Run by hand
# from main. Needs a paid Apple Developer account and these repository secrets:
#   APPLE_TEAM_ID        10-character team ID
#   ASC_KEY_ID           App Store Connect API key ID
#   ASC_ISSUER_ID        App Store Connect issuer ID
#   ASC_KEY_P8_BASE64    the .p8 key file, base64 encoded
# See docs/APP-STORE.md. The API key needs the Admin role so Xcode can manage
# certificates and profiles.
on:
  workflow_dispatch:
    inputs:
      upload:
        description: 'Upload to TestFlight (off builds and signs only)'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: notoryx-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  testflight:
    if: github.ref == 'refs/heads/main'
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
    steps:
      - name: Check signing secrets
        run: |
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing repository secret $name. See docs/APP-STORE.md."
              exit 1
            fi
          done
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
      - name: Generate and prepare the iOS project
        run: |
          flutter create --no-pub --platforms=ios --org com.bastionmesh --project-name bastion .
          git checkout -- pubspec.lock
          rm -f test/widget_test.dart
          flutter pub get --enforce-lockfile
          flutter build ios --config-only --no-codesign
          python3 scripts/prepare_ios.py
          flutter build ios --release --no-codesign
      - name: Install the App Store Connect key
        run: |
          KEY_PATH="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$KEY_PATH"
          cp "$KEY_PATH" "$HOME/.appstoreconnect/private_keys/"
          echo "KEY_PATH=$KEY_PATH" >> "$GITHUB_ENV"
      - name: Archive and sign
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>method</key><string>app-store-connect</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>signingStyle</key><string>automatic</string>
            <key>uploadSymbols</key><true/>
          </dict></plist>
          PLIST
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY_PATH"
                -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          xcodebuild archive -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Runner.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CODE_SIGN_STYLE=Automatic "${AUTH[@]}"
          xcodebuild -exportArchive -archivePath build/Runner.xcarchive \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" -exportPath build/ipa "${AUTH[@]}"
          ls -l build/ipa/*.ipa
      - name: Upload to TestFlight
        if: inputs.upload
        run: |
          xcrun altool --upload-app -f build/ipa/*.ipa -t ios \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
      - name: Remove the key
        if: always()
        run: rm -rf "$HOME/.appstoreconnect/private_keys" "${KEY_PATH:-/nonexistent}"
